config-version: 8

server:
  host: "127.0.0.1"
  port: 8318

management:
  secret-key: ""
  disable-control-panel: false

access:
  api-keys:
    - "dev-client"

routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-subagents: false
  retry:
    request-retry: 0

oauth:
  auth-dir: "~/.cli-proxy-api-dev"

api-keys:
  claude:
    - name: fake
      base-url: "http://127.0.0.1:8319"
      keys:
        - api-key: "fake-key-a"
        - api-key: "fake-key-b"

observability:
  logs:
    logging-to-file: false
    debug: true
    request-log: false

plugins:
  enabled: true
  dir: ".target/dev/plugins"
  configs:
    oneclaude:
      enabled: true
      data-dir: ".target/dev/data"
